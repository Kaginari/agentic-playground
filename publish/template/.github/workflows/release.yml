name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # the GitHub Release
  packages: write      # the GHCR image
  id-token: write      # build provenance (Sigstore, keyless)
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tests must pass on the tagged commit
        run: go test ./...
      - name: Release notes — the tag's section of CHANGELOG.md goes on top of the generated list
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > .release-header.md
          if [ ! -s .release-header.md ]; then echo "CHANGELOG.md has no section for [$v]"; exit 1; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-header .release-header.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.tar.gz"
